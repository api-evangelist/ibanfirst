generated: '2026-08-17'
method: derived
source: >-
  mcp/ibanfirst-mcp.yml (tool list from https://docs.ibanfirst.com/guides/mcp-connector) bound
  against openapi/ibanfirst-clientapi-openapi.yml (iBanFirst API 1.6.0, 30 paths / 38 operations)
note: >-
  IMPORTANT: the iBanFirst OpenAPI declares NO operationId on any of its 38 operations, so
  every rest[] reference below is the verbatim "METHOD /path" pair from the spec's paths object
  rather than an operationId. That is the strongest identifier the contract actually publishes;
  nothing here is invented. Live MCP tools/list is OAuth-gated (HTTP 401), so bindings are made
  by tool name + the provider's own tool description against the spec path, and confidence is
  recorded honestly per row.

surfaces:
  openapi:
    file: openapi/ibanfirst-clientapi-openapi.yml
    source: https://docs.ibanfirst.com/_spec/api/ClientAPI.yaml
    version: 1.6.0
    servers:
      - https://api-demo.ibanfirst.com/api
      - https://api.ibanfirst.com/api
    operations: 38
    operation_ids_declared: 0
    gated: >-
      Reference and spec are public; calling requires an X-WSSE credential issued by iBanFirst
      support, so live calls are gated but the contract is not.
  mcp:
    url: https://mcp.ibanfirst.com/mcp
    docs: https://docs.ibanfirst.com/guides/mcp-connector
    tools: 16
    gated: >-
      tools/list returns HTTP 401 invalid_token without an OAuth bearer token, so per-tool
      inputSchema could not be read; parameters are inherited from the bound REST operation.
  graphql: null
  asyncapi: null
  webhooks:
    docs: https://docs.ibanfirst.com/api/clientapi/webhook-subscriptions
    managed_via_rest: true

crosswalk:
