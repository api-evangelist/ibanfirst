    confidence: high
  - tool: get_financial_movements
    category: Financial movements
    rest: ['GET /financialMovements']
    binding: rest
    confidence: high
    note: >-
      The tool description caps history at "the last 12 months only"; the REST operation
      exposes fromDate/toDate query parameters with no documented cap. The MCP tool is the
      narrower surface.
  - tool: get_financial_movement_details
    category: Financial movements
    rest: ['GET /financialMovements/{id}']
    binding: rest
    confidence: high
  - tool: get_payments_by_status
    category: Payments
    rest: ['GET /payments/{status}']
    binding: rest
    confidence: high
  - tool: get_payment_details
    category: Payments
    rest: ['GET /payments/{id}']
    binding: rest
    confidence: high
  - tool: get_payment_options
    category: Payments
    rest: ['GET /payments/options/{walletId}/{externalBankAccountId}']
    binding: rest
    confidence: high
    note: >-
      The REST operation requires BOTH a wallet id and a beneficiary id; the tool description
      only mentions "a given wallet", so the tool may default or require the second argument.
      Unverifiable without authenticated tools/list.
  - tool: get_fx_rates
    category: FX rates & trades
    rest: ['POST /quotes']
    binding: rest
    confidence: medium
    note: >-
      "Live indicative FX rates" has no dedicated GET in the REST contract. POST /quotes
      ("Ask for a spot quote", returns the Quote/Rate schemas) is the only rate-producing
      operation in the spec, so the tool is almost certainly backed by it — but the mapping
      is inferred from semantics, not from an authenticated tools/list.
  - tool: get_trades
    category: FX rates & trades
    rest: ['GET /trades/_{status}']
    binding: rest
    confidence: high
    note: The spec path literally contains an underscore before the status template.
  - tool: get_trade_details
    category: FX rates & trades
    rest: ['GET /trades/{id}']
    binding: rest
    confidence: high
  - tool: get_fix_forwards
    category: Fix-forward trades
    rest: ['GET /fixed-forwards']
    binding: rest
    confidence: high
  - tool: get_fix_forward
    category: Fix-forward trades
    rest: ['GET /fixed-forwards/{fixedForwardId}']
    binding: rest
    confidence: high
  - tool: get_external_bank_accounts
    category: Beneficiaries
    rest: ['GET /externalBankAccounts']
    binding: rest
    confidence: high
  - tool: get_external_bank_account_by_id
    category: Beneficiaries
    rest: ['GET /externalBankAccounts/{id}']
    binding: rest
    confidence: high

mcp_only:
  - tool: disconnect_ibanfirst_mcp
    reason: >-
      Connector session management. Detaches the iBanFirst account from the MCP client; there
      is no REST equivalent because X-WSSE is stateless and has no session to tear down.

rest_only:
  - capability: Account provisioning
    operations: ['POST /wallets']
  - capability: Beneficiary management (write)
    operations:
      - 'POST /externalBankAccounts'
      - 'DELETE /externalBankAccounts/{id}'
  - capability: Payment initiation and lifecycle
    operations:
      - 'POST /payments'
      - 'PUT /payments/{id}/confirm'
      - 'PUT /payments/{id}/proofOfTransaction'
      - 'DELETE /payments/{id}'
  - capability: Spot trade booking
    operations: ['POST /trades']
  - capability: Fixed forward quoting and booking
    operations:
      - 'POST /fixed-forwards/quote'
      - 'POST /fixed-forwards'
  - capability: Documents
    operations:
      - 'GET /documents'
      - 'GET /documents/{id}'
      - 'GET /documents/RIB'
      - 'PUT /documents/upload/{object}/{objectId}/{typeOfDocumentation}'
  - capability: Webhook subscription management
    operations:
      - 'POST /webhooks'
      - 'GET /webhooks'
      - 'GET /webhooks/{webhookId}'
      - 'PATCH /webhooks/{webhookId}'
      - 'DELETE /webhooks/{webhookId}'
      - 'POST /webhooks/{webhookId}/rotate-secret'
      - 'GET /webhooks/{webhookId}/failed-notifications'
  - capability: API call logs
    operations:
      - 'GET /logs'
      - 'GET /logs/{nonce}'

coverage:
  tools_named: 16
  tools_bound_to_rest: 15
  mcp_only: 1
  rest_operations_total: 38
  rest_operations_with_a_tool: 15
  rest_operations_without_a_tool: 23
  rest_coverage_pct: 39
  divergence: >-
    The MCP surface is read-only: every one of the 15 bound tools is a GET, or (for get_fx_rates)
    a non-mutating quote POST. All 23 unbound REST operations that write — creating payments,
    confirming payments, booking trades and forwards, managing beneficiaries and webhooks — have
    no agent tool. An agent connected to iBanFirst can read a treasury position and quote a rate
    but cannot move money.
