    category: Wallets
    rest: ['GET /wallets']
    binding: rest
    confidence: high
  - tool: get_wallet_details
    category: Wallets
    rest: ['GET /wallets/{id}']
    binding: rest
    confidence: high
  - tool: get_wallet_balance
    category: Wallets
    rest: ['GET /wallets/{id}/balance/{date}']
