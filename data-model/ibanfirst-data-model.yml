    operations:
      - 'GET /payments/options/{walletId}/{externalBankAccountId}'
      - 'POST /payments'
      - 'PUT /payments/{id}/confirm'
      - 'PUT /payments/{id}/proofOfTransaction'
      - 'GET /payments/{status}'
      - 'GET /payments/{id}'
      - 'DELETE /payments/{id}'
    note: >-
      Two-phase: created then confirmed. speedOption added in 1.6.0; tracker (SWIFT payment
