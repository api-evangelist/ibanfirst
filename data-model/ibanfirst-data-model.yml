note: >-
  Entity graph derived from the OpenAPI components.schemas ($ref links plus id-reference fields
  such as sourceWalletId and externalBankAccountId). 42 schemas are declared, of which 14 are
  entities and the rest are shared value types (Amount, Currency, Date, CurrencyPair, ID, ...).
  Relationships expressed by an id field are typed by NAME, because the spec declares them only as
  the shared `ID` scalar - it never $refs the target entity, so the graph is inferred from field
  naming and confirmed against the operations that consume those ids. Confidence is recorded per
  edge.

entities:
  - name: Wallet
    label: Account / augmented currency account
    description: Representation of a Wallet - a currency-denominated iBanFirst account with its own IBAN.
    id_field: id
    key_fields: [id, currency, tag, status, accountNumber]
    embedded: [correspondentBank -> CorrespondantBank, holderBank -> HolderBank, holder -> Holder]
    operations:
      - 'POST /wallets'
      - 'GET /wallets'
      - 'GET /wallets/{id}'
      - 'GET /wallets/{id}/balance/{date}'
    note: >-
      "Wallet" in the contract, "account" in the product and in the MCP tool names (get_wallets).
      accountNumber carries the IBAN or local account number.
  - name: Balance
    label: Account balance at a date
    id_field: null
    key_fields: [closingDate, bookingAmount, valueAmount]
    operations: ['GET /wallets/{id}/balance/{date}']
    note: >-
      A value object, not an addressable resource - only reachable through its parent wallet and a
      date.
  - name: FinancialMovement
    label: Transaction / statement line
    id_field: id
    key_fields: [id, bookingDate, valueDate, orderingAccountNumber, beneficiaryAccountNumber,
      orderingAmount, beneficiaryAmount, remittanceInformation, exchangeRate, typeLabel,
      internalReference]
    operations:
      - 'GET /financialMovements'
      - 'GET /financialMovements/{id}'
    note: >-
      Deliberately denormalised: counterparties are free-form strings (orderingCustomer,
      beneficiaryInstitution) and account references are account NUMBERS, not entity ids, so a
      movement cannot be joined back to a Wallet or ExternalBankAccount by id - only by matching
      accountNumber. This is the weakest join in the model.
  - name: ExternalBankAccount
    label: Beneficiary
    id_field: id
    key_fields: [id, currency, tag, accountNumber, contactEmail]
    embedded: [correspondentBank -> CorrespondantBank, holderBank -> HolderBank, holder -> Holder]
    operations:
      - 'POST /externalBankAccounts'
      - 'GET /externalBankAccounts'
      - 'GET /externalBankAccounts/{id}'
      - 'DELETE /externalBankAccounts/{id}'
    note: >-
      Creation is subject to verification of payee; a mismatch returns ErrorVOP with a proposed
      account_holder_name / account_holder_type correction. contactEmail added in API 1.4.0.
  - name: Payment
    label: Outgoing payment
