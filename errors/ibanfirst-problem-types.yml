note: >-
  Derived from the OpenAPI response definitions. iBanFirst does NOT use RFC 9457
  application/problem+json; it returns a proprietary JSON error object. Crucially, the spec does
  not enumerate individual 4xx/5xx status codes on ANY operation - every one of the 38 operations
  declares a single `default` response bound to the Error (or ErrorVOP) schema alongside its 200
  or 204. That means the machine-readable contract tells a client the SHAPE of an error but not
  WHICH errors an operation can produce, and there is no public error-code registry: the numeric
  errorCode values and their meanings are not published anywhere a non-customer can read. The
  `link` field in the envelope points at a page describing the error, but those pages are not
  enumerated in the docs. This is a real gap and it is recorded rather than filled in.

envelope:
  media_type: application/json
  schema: Error
  properties:
    errorCode:
      type: number
      format: int
      description: The code referring the error.
    errorType:
      type: string
      description: A short description identifying a general category for the error that occurred.
    errorMessage:
      type: string
      description: Error description.
    link:
      type: string
      description: A hyperlink to access the page that describes more accurately the error.

variants:
  - schema: ErrorVOP
    description: >-
      Error envelope extended with a payeeVerification block, returned when verification of payee
      (VoP) does not fully match the submitted beneficiary. Introduced with payee verification in
      API 1.3.0.
    adds:
      payeeVerification:
        status:
          enum: [PARTIAL, FAILED]
        message: Verification of payee result details.
        corrections:
          account_holder_name: Expected beneficiary name.
          account_holder_type:
            enum: [Individual, Corporate]
    used_by:
      - 'POST /externalBankAccounts'
      - 'POST /payments'
    handling: >-
      Treat PARTIAL as an actionable correction rather than a terminal failure: resubmit with
      corrections.account_holder_name / account_holder_type. Treat FAILED as a stop.

