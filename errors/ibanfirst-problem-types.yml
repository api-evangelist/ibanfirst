  schema: webhookFailedNotification
  fields: [id, notificationContent, errorMessage, httpStatusCode, failedAt, retryCount]
  retrieval: 'GET /webhooks/{webhookId}/failed-notifications'
  note: >-
    iBanFirst records the receiver's failure, not its own: httpStatusCode is the status the
    customer's endpoint returned. Failures are retried twice with a 60-second delay (three
    attempts total) for HTTP 400 and 500 responses.

