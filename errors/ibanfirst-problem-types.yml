    body: application/json, 152 bytes
    note: Probed live on 2026-08-17; the edge returns a JSON 401 for /api/* without credentials.
  - status: 503
    observed_at: 'https://api.ibanfirst.com/<any path outside /api/*>'
    body: text/html
    note: >-
      The API edge returns an HTML 503 rather than a 404 for unrouted paths, so a client that
      mistypes a base path receives a misleading "service unavailable" instead of "not found".

webhook_delivery_errors:
