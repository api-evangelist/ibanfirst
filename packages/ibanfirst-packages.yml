    downloads_total: 0
    note: >-
      First-party by vendor namespace and by repository - it is published from the company's own
      public GitLab group gitlab.com/ibanfirst-it, the only public project in that group - but it
      is a Symfony bundle for querying Elasticsearch, NOT a client for the iBanFirst API. Only a
      dev-master branch is tagged; there has never been a semver release, so `version` is null
      rather than guessed. Last activity 2019-03-21, zero total downloads. Recorded here because
      it is the company's only public package, and its state is itself the finding.

