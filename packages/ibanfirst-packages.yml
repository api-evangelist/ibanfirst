  npm registry search, PyPI, RubyGems, Packagist, GitHub code search, gitlab.com/ibanfirst-it, and
  the iBanFirst docs/SDK pages
official_sdk_count: 0
note: >-
  iBanFirst ships NO first-party API client library in any language. This was searched, not
  assumed: npm registry search for "ibanfirst" returns zero packages; PyPI has no `ibanfirst` or
  `ibanfirst-api` project (404 on both); RubyGems search returns nothing; Packagist has exactly two
  hits, one community client and one unrelated first-party Symfony bundle. What iBanFirst provides
  instead of SDKs is inline code samples in five languages (Python, JavaScript, PHP, Java, Go) for
  computing the X-WSSE digest, embedded in the OpenAPI info.description, plus a public Postman
  collection. Because no official client library exists, this repo deliberately does NOT carry an
  `SDKs` pointer in apis.yml - the artifact records a real zero.

