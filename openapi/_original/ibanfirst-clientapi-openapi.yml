                  description: Expected beneficiary name.
                account_holder_type:
                  type: string
                  enum:
                    - Individual
                    - Corporate
                  description: Expected beneficiary type.
    Document:
      type: object
      description: |
        Representation of a document.
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          description: |
            The name of the document.
          type: string
        type:
          description: |
            The type of the document.
          type: string
        createdDate:
          $ref: '#/components/schemas/Datetime'
        lastOpennedDate:
          $ref: '#/components/schemas/Datetime'
        mimeType:
          description: |
            The MIME type of the document.
          type: string
        link:
          description: |
            The one-time link to access or download the document.
          type: string
    Webhook:
      type: object
      description: |
        Representation of a webhook subscription.
      properties:
        webhookId:
          $ref: '#/components/schemas/webhookId'
        events:
          description: |
            List of subscribed events.
          type: array
          items:
            $ref: '#/components/schemas/events'
        url:
          $ref: '#/components/schemas/url'
    UserInformation:
      type: object
      description: >
        Representation of a set of user informations got by the Authentication
        service.
      properties:
        username:
          type: string
          description: |
            The username of the user.
        pass:
          type: string
          description: |
            The encrypted pass of the user.
        civility:
          type: string
          description: |
            The civility of the user.
        firstname:
          type: string
          description: |
            The first name of the user.
        lastname:
          type: string
          description: |
            The last name of the user.
        entityname:
          type: string
          description: |
            The the user's company's name.
        roles:
          type: array
          description: |
            An array describing the roles of the user.
          items:
            type: string
            description: |
              A string containing the name of the role of the user.
    webhookFailedNotification:
      type: object
      properties:
        id:
          description: Unique ID of a notification
          type: string
          pattern: ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$
          example: cf16243d-7e0a-4a5b-b996-ba7018201e30
        notificationContent:
          $ref: '#/components/schemas/notificationContent'
        errorMessage:
          description: ''
          type: string
        httpStatusCode:
          description: ''
          type: string
          example: '404'
        failedAt:
          type: string
          pattern: ''
          description: ''
        retryCount:
          description: ''
          type: integer
    notificationContent:
      type: object
      properties:
        payload:
          description: >-
            Content of the notification, see get payment details, get trade
            details
        eventType:
          type: string
          description: Event that triggered the notification.
        webhookId:
          $ref: '#/components/schemas/webhookId'
    ID:
      type: string
      pattern: ^[A-Za-z0-9]+$
      format: ^[A-Za-z0-9]+$
      example: Na5Dv6E
      description: >
        A String representing the id of an object. This string contains
        alpha-numeric characters, including the capital ones.
    quoteRef:
      type: string
      pattern: ^ui[0-9]{4}-[0-9]{5}-[0-9]{13}$
      format: ^ui[0-9]{4}-[0-9]{5}-[0-9]{13}$
      example: ui9230-29830-1773244279236
      description: |
        A String representing the unique ID of the quote.
    webhookId:
      type: string
      pattern: ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$
      example: cf16243d-7e0a-4a5b-b996-ba7018201e30
      description: |
        ID of the webhook subscription.
    QuotedDecimal:
      type: string
      pattern: ^((\-)?)[0-9]{12}((\.[0-9]{1,7})?)$
      format: ^((\-)?)[0-9]{12}((\.[0-9]{1,7})?)$
      example: '2.257'
      description: |
        A String representing a formatted floating number.
    Currency:
      type: string
      pattern: ^[A-Z]{3}$
      format: ^[A-Z]{3}$
      example: USD
      description: >
        A String representing the Three-digit ISO 4217 Currency Code of a
        currency. This String only contains capitalized letters.
    Date:
      type: string
      pattern: ^[0-9]{4}\-[0-9]{2}\-[0-9]{2}$
      format: ^[0-9]{4}\-[0-9]{2}\-[0-9]{2}$
      example: '2016-01-01'
      description: |
        A String representing a date by its year, month and day in month.
            
    Datetime:
      type: string
      pattern: >-
        ^((19[0,99]|2[0-9]{3})\-(0[1-9]|1[012])\-([012][0-9]|3[01])\
        ([01][0-9]|2[0-3])\:([0-5][0-9])\:([0-5][0-9]))$
      format: >-
        ^((19[0,99]|2[0-9]{3})\-(0[1-9]|1[012])\-([012][0-9]|3[01])\
        ([01][0-9]|2[0-3])\:([0-5][0-9])\:([0-5][0-9]))$
      example: '2016-01-01 00:00:00'
      description: >
        A String representing a date by its year, month, day in month, hour,
        minute and second.
    DatetimeFractionnal:
      type: string
      pattern: >-
        ^((19[0-9]{2}|2[0-9]{3})\-(0[1-9]|1[0-2])\-([0-2][0-9]|3[01])T([01][0-9]|2[0-3])\:([0-5][0-9])\:([0-5][0-9])\.[0-9]{1,9}Z)$
      format: >-
        ^((19[0-9]{2}|2[0-9]{3})\-(0[1-9]|1[0-2])\-([0-2][0-9]|3[01])T([01][0-9]|2[0-3])\:([0-5][0-9])\:([0-5][0-9])\.[0-9]{1,9}Z)$
      example: '2026-03-11T15:51:31.236943879Z'
      description: >
        A string representing a UTC date-time in ISO 8601 format including year,
        month, day, hour, minute, second, and fractional seconds, terminated
        with the 'Z' UTC designator.
    CurrencyPair:
      type: string
      pattern: ^[A-Z]{6}$
      format: ^[A-Z]{6}$
      example: EURUSD
      description: >
        A String representing two concatenated Three-digit ISO 4217 Currency
        Code of a currency. This String only contains capitalized letters.
            
            
            
            
            
            
            
            
            
            
            
            
            
            
            
            
            
    events:
      type: array
      items:
        type: string
        enum:
          - PAYMENT_CREATED
          - PAYMENT_PLANIFIED
          - PAYMENT_FINALIZED
          - PAYMENT_WAITING_SIGNATURE
          - PAYMENT_AWAITING_CONFIRMATION
          - PAYMENT_CANCELED
          - PAYMENT_BLOCKED
          - PAYMENT_WAITING_JUSTIFICATION
          - PAYMENT_INCOMING
          - TRADE_PLANIFIED
          - TRADE_FINALIZED
          - TRADE_CANCELED
          - TRADE_BLOCKED
    url:
      type: string
      description: |
        Notifications are sent to this url.
      pattern: ^(https?:\/\/)[^\s/$.?#].[^\s]*$
      example: https:\www.notification.com
    Email:
      type: string
      description: Beneficiary email address
      pattern: ^[A-Za-z0-9._-]+@[A-Za-z0-9._-]+\.[A-Za-z]{2,}$
    paymentSpeedOption:
      description: |
        A code representing the speed option.
      type: string
      enum:
        - 48H
        - 24H
        - 1H
        - instant
    paymentPriorityOption:
      description: >
        A code representing whether this payment has a standard priority, or a
        priority treatment.
      type: string
      enum:
        - normal
        - urgent
