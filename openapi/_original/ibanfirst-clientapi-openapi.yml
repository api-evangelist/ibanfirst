    put:
      summary: Upload a document
      tags:
        - Documents
      description: >
        This service allows you to upload documents.

         For an `externalBankAccount` object type (*beneficiary*), you may only upload an `identity` type of document.

        For a `payment` object type, you may upload either a `identity` or
        `invoice` type of document.


        To send a file, you have to extract its content in a binary format,
        encode it with a base64 algorithm and insert the result in the `file`
        field of the body request.
      parameters:
        - name: object
          in: path
          description: |
            The type of object you want to upload a document on.
          required: true
          schema:
            type: string
            enum:
              - externalBankAccount
              - payment
        - name: objectId
          in: path
          description: >
            The unique identifier of the object you want to upload a document
            on.
          required: true
          schema:
            type: string
        - name: typeOfDocumentation
          in: path
          description: |
            The type document you want to upload on your object.
          required: true
          schema:
            type: string
            enum:
              - identity
              - invoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - tag
                - file
              properties:
                tag:
                  description: |
                    The name of the document to be attached.
                  type: string
                file:
                  description: >
                    The binary content of the file, encoded with a base64
                    algorithm.
                  type: string
        description: |
          The document to upload
        required: true
      responses:
        '200':
          description: OK
          content:
