        - name: per_page
          in: query
          description: Number of items returned per page.
          required: false
          schema:
            type: string
            default: '50'
        - name: sort
          in: query
          description: |
            Notifications are sorted by creation date. 
          required: false
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: DESC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  failedNotifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/webhookFailedNotification'
                  totalCount:
                    description: Total count of failed notifications
                    type: string
                    example: '10'
                  page:
                    description: |
                      Index of the page.
                    type: string
                    example: '1'
                  perPage:
                    description: |
                      Number of items returned per page.
                    type: string
                    example: '50'
                  totalPages:
                    description: |
                      Number of pages.
                    type: string
                    example: '10'
        default:
          description: ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /logs:
    get:
      summary: Get logs list
      tags:
        - Logs
      description: >-
        The iBanFirst API provides a log feed for every request sent allowing
        you to know exactly the result on our platform.

         This service uses the login sent in your header as a filter to get logs about this user's actions.
      parameters:
        - name: page
          in: query
          description: |
            Index of the page.
          required: false
          schema:
            type: string
            default: '1'
        - name: per_page
          in: query
          description: |
            Number of items returned.
          required: false
          schema:
            type: string
            default: '50'
        - name: sort
          in: query
          description: |
            A code representing the order of rendering objects.
          required: false
          schema:
            type: string
            enum:
              - ASC
              - DESC
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Log'
        '204':
          description: No logs found
        default:
          description: ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /logs/{nonce}:
    get:
      summary: Get log details
      tags:
        - Logs
      description: >
        In case of somewhat happens during the request, this service API allows
        you to retrieve a log entry by its nonce.  
      parameters:
        - name: nonce
          in: path
          description: >
            The nonce used to authenticate the request. As the one in the
            header, this nonce has to be Base64 encoded. The nonce you get with
            `GET /logs` is already encoded.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
        default:
          description: ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
servers:
  - url: https://api-demo.ibanfirst.com/api
components:
  requestBodies:
    Quote:
      content:
        application/json:
          schema:
            type: object
            required:
              - currencyPair
              - side
              - amount
              - deliveryDate
            properties:
              currencyPair:
                $ref: '#/components/schemas/CurrencyPair'
              side:
                description: |
                  The side representing the quote. `S` to sell and `B` to buy.
                type: string
                enum:
                  - B
                  - S
              amount:
                $ref: '#/components/schemas/Amount'
              deliveryDate:
                $ref: '#/components/schemas/Date'
      required: true
  securitySchemes:
    X-WSSE:
      type: apiKey
      in: header
      name: X-WSSE
      description: >-
        X-WSSE token-based authentication. The header value must be computed
        fresh for every request (tokens expire in ~5 minutes).


        Header value format:

        ```

        UsernameToken Username="<username>", PasswordDigest="<digest>",
        Nonce="<nonce_b64>", Created="<timestamp>"

        ```


        Algorithm:

        1. Generate a random nonce: ≥ 32 lowercase hex characters.

        2. Get current UTC timestamp in ISO 8601: `YYYY-MM-DDTHH:MM:SSZ`.

        3. Compute `PasswordDigest = Base64( SHA-1( nonce_bytes + created_bytes
        + secret_bytes ) )` — SHA-1 over the raw UTF-8 bytes concatenated in
        that order, result must be the binary digest before Base64 encoding.

        4. Compute `Nonce = Base64( nonce_utf8_bytes )`.


        See the `info.description` field at the top of this spec for full code
        samples in Python, JavaScript, PHP, Java, and Go.
