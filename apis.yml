aid: ibanfirst
name: iBanFirst
description: >-
  iBanFirst is a Brussels-headquartered cross-border payment and foreign-exchange platform for
  businesses, licensed as a payment institution by the National Bank of Belgium (company number
  0849.872.824) and operating across Belgium, France, the Netherlands, Germany, Spain, Romania,
  Bulgaria, Italy, Hungary and the United Kingdom. It provides multi-currency "augmented currency
  accounts" with dedicated IBANs, SWIFT and SEPA payments with payment tracking, spot FX in 30+
  currencies, and fixed forward payment contracts for currency-risk hedging. Its developer surface
  is a public REST API (iBanFirst API 1.6.0, 38 operations over accounts, financial movements,
  beneficiaries, payments, spot trades, fixed forwards, documents and webhook subscriptions),
  X-WSSE token authentication, HMAC-SHA256-signed webhooks for payment and trade events, a
  separate eIDAS/QWAC-gated PSD2 XS2A API for AIS and PIS third-party providers, and a hosted
  first-party remote MCP server that gives agents read access to treasury data.
