- aid: ibanfirst:ibanfirst-spot-trades-api
  name: iBanFirst Spot trades API
  description: >-
    The API provides a deliverable FX facility and deliverable FX liquidity. You will become counterparty
    to iBanFirst and can market and sell deliverable FX services to corporate and private clients as well
    as using such services on their behalf.


    FX trades are always made between two accounts of a unique counterparty. iBanFirst will automatically
    debit the source account and credit the delivery account at the date specified in the FX trade instructions.
    If the delivery date has been scheduled, the delivery is automatically processed in the morning before
    00:30 am Paris time. If the delivery date is today (TOD), the funds is available on your account by
    the next 20mn.


    A FX trades also involves an amount, which includes both the numeric amount and the currency in order
    to define if this amount is the nominal to be bought or sold, for example: '100000.00+GBP'.
  humanURL: https://docs.ibanfirst.com/api/clientapi
