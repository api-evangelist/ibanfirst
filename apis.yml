- name: iBanFirst PSD2 XS2A API
  description: >-
    PSD2 access-to-account API for registered third-party providers, covering account information services
    (AIS), payment initiation services (PIS) and strong customer authentication. A sandbox is published
    for TPP development and testing. Access requires a qualified eIDAS QWAC certificate; onboarding is
    by request to open-api@ibanfirst.com. The sandbox host terminates anonymous TLS handshakes, so no
    machine-readable specification for this API could be retrieved without a client certificate.
  humanURL: https://ibanfirst.com/psd2-api
