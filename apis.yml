apis:
- name: iBanFirst MCP Connector
  description: >-
    First-party hosted remote MCP server, launched with API 1.7.0 on 2026-06-05, exposing 16 read tools
    over wallets, balances, financial movements, payments, live FX rates, spot trades, fixed forwards
    and beneficiaries. Documented as a Claude.ai / Claude Desktop custom connector; authentication is
    OAuth 2.0 with dynamic client registration (RFC 8414 + RFC 9728 metadata served at the endpoint).
    tools/list is OAuth-gated. No write tools are exposed.
  humanURL: https://docs.ibanfirst.com/guides/mcp-connector
