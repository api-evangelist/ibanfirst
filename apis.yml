apis:
  - name: iBanFirst API
    description: >-
      REST API for automated cross-border payments and currency exchange: manage multi-currency
      accounts (wallets) and their IBANs, read balances and financial movements, create and delete
      beneficiaries with payee verification, price and initiate payments (with speed and priority
      options and proof-of-transaction upload), request spot FX quotes and book spot trades, quote
      and book fixed forward payment contracts, pull account documents and RIBs, and manage
      HMAC-signed webhook subscriptions for payment and trade events. Authentication is a
      per-request X-WSSE UsernameToken digest; credentials are issued by iBanFirst support.
    humanURL: https://docs.ibanfirst.com/api/clientapi
    baseURL: https://api.ibanfirst.com/api
    tags:
      - cross-border-payments
      - foreign-exchange
      - b2b-payments
      - treasury
      - multi-currency-accounts
      - swift
      - sepa
      - webhooks
