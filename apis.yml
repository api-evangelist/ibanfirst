  name: iBanFirst Payments API
  description: "Sending funds from one of your iBanFirst accounts to your own external bank account or\
    \ a third-party recipient involves two steps:\n\n1. Generate the payment object with the 'Create payment'\
    \ method.  \nA unique id is assigned to each payment.  \n\n2. Use the 'Confirm Payment' method to\
    \ send the payment for processing. \nWhen you confirm a payment, make sure you have sufficient funds\
    \ in your account balance. \n\n**Caution:** Payments are automatically rolled to the next closest\
    \ working days if not confirmed in the scheduled date of operation. If the balance of your account\
