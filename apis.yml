      - type: Glossary
        url: https://docs.ibanfirst.com/glossary
  - name: iBanFirst MCP Connector
    description: >-
      First-party hosted remote MCP server, launched with API 1.7.0 on 2026-06-05, exposing 16
      read tools over wallets, balances, financial movements, payments, live FX rates, spot trades,
      fixed forwards and beneficiaries. Documented as a Claude.ai / Claude Desktop custom
      connector; authentication is OAuth 2.0 with dynamic client registration (RFC 8414 + RFC 9728
      metadata served at the endpoint). tools/list is OAuth-gated. No write tools are exposed.
    humanURL: https://docs.ibanfirst.com/guides/mcp-connector
    baseURL: https://mcp.ibanfirst.com/mcp
    tags:
      - mcp
      - agent-native
      - treasury
      - foreign-exchange
      - cross-border-payments
    properties:
      - type: MCPServer
        url: mcp/ibanfirst-mcp.yml
      - type: MCPServer
        url: https://mcp.ibanfirst.com/mcp
      - type: ToolCrosswalk
        url: mcp/ibanfirst-tool-crosswalk.yml
      - type: Documentation
        url: https://docs.ibanfirst.com/guides/mcp-connector
      - type: Authentication
        url: authentication/ibanfirst-authentication.yml
  - name: iBanFirst PSD2 XS2A API
    description: >-
      PSD2 access-to-account API for registered third-party providers, covering account
      information services (AIS), payment initiation services (PIS) and strong customer
      authentication. A sandbox is published for TPP development and testing. Access requires a
      qualified eIDAS QWAC certificate; onboarding is by request to open-api@ibanfirst.com. The
      sandbox host terminates anonymous TLS handshakes, so no machine-readable specification for
      this API could be retrieved without a client certificate.
    humanURL: https://ibanfirst.com/psd2-api
    baseURL: https://open-api-sdbx.ibanfirst.com/Banking/API
    tags:
      - psd2
      - open-banking
      - account-information
      - payment-initiation
      - regulatory
    properties:
      - type: Documentation
        url: https://ibanfirst.com/psd2-api
      - type: Compliance
        url: https://ibanfirst.com/psd2-api
      - type: Support
        url: mailto:open-api@ibanfirst.com
